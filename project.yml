name: WatchVoiceIntake
options:
  bundleIdPrefix: com.shuyinlab.watchvoiceintake
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true

settings:
  MARKETING_VERSION: "0.1.0"
  CURRENT_PROJECT_VERSION: "1"
  # Phase 1 goal is "compiles", not "signed" — CI runs xcodebuild with no
  # signing identity. Leaving this empty (not "iPhone Developer") lets an
  # unsigned build succeed; a real signing identity only gets set once
  # Phase 5 (real device) actually needs one.
  CODE_SIGN_STYLE: Manual
  CODE_SIGNING_REQUIRED: NO
  CODE_SIGNING_ALLOWED: NO

targets:
  WatchVoiceIntake:
    type: application
    platform: iOS
    sources:
      - path: iOS
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Voice Intake
        NSMicrophoneUsageDescription: >-
          用于录制语音笔记并转写整理——录音只在你主动点击开始时进行。
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [armv7]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.shuyinlab.watchvoiceintake
      TARGETED_DEVICE_FAMILY: "1"
      # Without this, the archived .xcarchive's Info.plist came out missing
      # ApplicationProperties entirely (no SigningIdentity/Team/bundle info)
      # even though codesign itself reported success per-target — Export
      # then can't determine any valid distribution method for the archive
      # at all. The Watch target already had this; the main app target was
      # relying on Xcode's default, which isn't reliably NO in this setup.
      SKIP_INSTALL: NO
      # Only takes effect when release.yml overrides CODE_SIGNING_ALLOWED to
      # YES — build.yml's unsigned compile check forces it back to NO, so
      # these are inert there. Named to match the App Store profile created
      # manually in the Developer Portal (see PROJECT_LOG.md) — automatic
      # signing proved unreliable in CI for a brand-new team, see the
      # signing pitfalls section there before changing this.
      CODE_SIGN_IDENTITY: "Apple Distribution"
      PROVISIONING_PROFILE_SPECIFIER: "WatchVoiceIntake AppStore"
    dependencies:
      - target: WatchVoiceIntakeWatch
        embed: true

  WatchVoiceIntakeWatch:
    # watchOS 9+ single-target app — NOT application.watchapp2 (that's the
    # pre-watchOS7 WatchKit App+Extension bundle format; using it alongside
    # a modern deploymentTarget makes XcodeGen emit both a normal copy phase
    # and an "Embed Watch Content" phase for the same output path, which
    # xcodebuild rejects as "Multiple commands produce ...WatchVoiceIntakeWatch").
    type: application
    platform: watchOS
    sources:
      - path: Watch
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Voice Intake
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.shuyinlab.watchvoiceintake
        NSMicrophoneUsageDescription: >-
          用于录制语音笔记——录音只在你主动点击开始时进行。
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.shuyinlab.watchvoiceintake.watchkitapp
      SKIP_INSTALL: NO
      TARGETED_DEVICE_FAMILY: "4"
      # See the matching comment on the WatchVoiceIntake target above.
      CODE_SIGN_IDENTITY: "Apple Distribution"
      PROVISIONING_PROFILE_SPECIFIER: "WatchVoiceIntakeWatch AppStore"

schemes:
  WatchVoiceIntake:
    build:
      targets:
        WatchVoiceIntake: all
        WatchVoiceIntakeWatch: all
