name: Release (TestFlight)

# Phase 5 groundwork: build a signed, App Store-distributable build and
# upload it to TestFlight. Manual trigger only — this costs an App Store
# Connect build slot and should happen when there's something worth
# testing, not on every push.
#
# Requires these repo secrets (Settings > Secrets and variables > Actions):
#   APPSTORE_ISSURE_ID       - App Store Connect API key Issuer ID (name has
#                              a typo from when it was first created — kept
#                              as-is rather than making the user redo it)
#   APPSTORE_KEY_ID          - App Store Connect API key Key ID
#   APPSTORE_PRIVATE_KEY     - contents of the downloaded .p8 API key file
#   APPLE_TEAM_ID            - Apple Developer Team ID (Membership page)
#   CERTIFICATE_P12_BASE64   - base64 of the exported Apple Distribution
#                              .p12 (cert + private key)
#   CERTIFICATE_PASSWORD     - password the .p12 was exported with
#
# Build/export/upload go through fastlane, not hand-rolled xcodebuild
# archive/export/altool calls — after many failed attempts pinning down
# undocumented Xcode 16 CLI export behavior (see PROJECT_LOG.md's "release.yml
# 反复失败排查" section), switched to the tool built specifically to absorb
# these per-Xcode-version quirks. Signing is manual, referencing the two App
# Store provisioning profiles created once in the Developer Portal (see
# PROJECT_LOG.md) — not automatic signing, which proved unreliable in CI for
# a brand-new team even after a Distribution certificate existed.
on:
  workflow_dispatch:

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls /Applications | grep -i xcode
          # Real root cause of the "Validation failed n/a / STATE_ERROR.
          # VALIDATION_ERROR" upload rejection (see PROJECT_LOG.md
          # 2026-08-17): a confirmed Apple regression in Xcode 26's
          # altool/ContentDelivery upload path — when an app has multiple
          # similar bundle IDs (our container app com.shuyinlab.watchvoiceintake
          # + Watch companion com.shuyinlab.watchvoiceintake.watchkitapp is
          # exactly this shape), it silently validates against the wrong
          # one. fastlane maintainers confirmed this in
          # https://github.com/fastlane/fastlane/issues/29743 (closed as
          # dup of #29698), "fixed in Xcode 26.1" — we were on 26.3 and
          # still hit it, so pin to Xcode 16.4 instead: it's this runner's
          # actual paired default (simulator runtimes match it correctly,
          # unlike the 16.2 side-install tried earlier) and entirely
          # predates the whole Xcode 26 upload-path bug class.
          sudo xcode-select -s "/Applications/Xcode_16.4.app"
          xcodebuild -version

      - name: Install XcodeGen and fastlane
        run: |
          brew install xcodegen
          gem install fastlane -N

      - name: Generate Xcode project
        run: xcodegen generate

      # The Apple Distribution certificate's private key only ever existed
      # in the Mac's local Keychain where it was generated (private keys
      # aren't something Apple's servers hand back) — this runner is a
      # fresh machine every time, so the cert has to be imported into a
      # throwaway keychain here before every build. Standard pattern, see
      # GitHub's own docs: "Installing an Apple certificate on macOS
      # runners for Xcode development."
      - name: Import signing certificate
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD=$(uuidgen)
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          CERT_PATH=$RUNNER_TEMP/certificate.p12

          echo -n "$CERTIFICATE_P12_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Without the WWDR intermediate + Apple Root CA in the chain, the
          # leaf "Apple Distribution" cert shows as untrusted (confirmed via
          # Keychain Access on the Mac it was generated on — same cert, same
          # missing-chain symptom) — codesign can still succeed since it
          # only needs the private key match, but exportArchive's stricter
          # trust validation (IDEDistributionMethodManager) fails on it,
          # which lines up with the "Unknown Distribution Error" every
          # attempt has hit regardless of tool/Xcode version/export method.
          curl -sSf -o "$RUNNER_TEMP/AppleWWDRCAG3.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          curl -sSf -o "$RUNNER_TEMP/AppleWWDRCAG4.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG4.cer
          curl -sSf -o "$RUNNER_TEMP/AppleWWDRCAG6.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG6.cer
          curl -sSf -o "$RUNNER_TEMP/AppleRootCA.cer" https://www.apple.com/appleca/AppleIncRootCertificate.cer
          for f in AppleWWDRCAG3 AppleWWDRCAG4 AppleWWDRCAG6 AppleRootCA; do
            security import "$RUNNER_TEMP/$f.cer" -k "$KEYCHAIN_PATH" -A || true
          done

          security import "$CERT_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed s/\"//g)
          security default-keychain -s "$KEYCHAIN_PATH"

      - name: Build and upload to TestFlight
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSURE_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: fastlane release

      # xcodebuild writes a detailed IDEDistribution log (which specific
      # distribution method got rejected and why) to a temp dir that's
      # discarded when the runner is torn down — every failure so far only
      # showed the generic wrapper error, never this. Xcode Cloud's
      # equivalent log (downloaded separately via the App Store Connect
      # API) showed EVERY distribution method rejected with "doesn't
      # support distributing archive" for a wrong-product archive; worth
      # comparing against what our correctly-scoped archive here actually
      # says instead of continuing to guess from the wrapper error alone.
      # Verbose distribution log shows EVERY method rejected, including
      # plain Development signing — not just app-store — meaning the
      # .xcarchive itself isn't being recognized as a distributable product
      # archive at all, regardless of team/cert/profile/auth. project.yml
      # already has a SKIP_INSTALL: NO comment anticipating exactly this
      # (archive's Info.plist missing ApplicationProperties). Dump it to
      # confirm before guessing further.
      - name: Debug — dump archive Info.plist
        if: always()
        run: |
          ARCHIVE=$(find /Users/runner/Library/Developer/Xcode/Archives -iname "*.xcarchive" -maxdepth 2 | head -1)
          echo "Archive: $ARCHIVE"
          if [ -n "$ARCHIVE" ]; then
            plutil -p "$ARCHIVE/Info.plist"
            echo "--- Products tree ---"
            find "$ARCHIVE/Products" 2>&1
            echo "--- dSYMs tree ---"
            find "$ARCHIVE/dSYMs" 2>&1
          fi

      - name: Save distribution logs
        if: always()
        run: |
          mkdir -p dist-logs
          find "$TMPDIR" /var/folders -maxdepth 4 -iname "*.xcdistributionlogs" -exec cp -r {} dist-logs/ \; 2>/dev/null || true
          find ~/Library/Developer/Xcode/DerivedData -iname "*.xcdistributionlogs" -exec cp -r {} dist-logs/ \; 2>/dev/null || true
          ls -la dist-logs/

      - name: Upload distribution logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: distribution-logs
          path: dist-logs/
          if-no-files-found: warn

      # Same "Unknown Distribution Error" across raw xcodebuild AND
      # fastlane, AND Xcode 16.4 AND 26.3 — ruling out both the tool and
      # the Xcode version. The one thing common to every attempt is the
      # two provisioning profiles we created manually. Dump what
      # -allowProvisioningUpdates actually downloaded (Archive succeeded,
      # so they're on disk) to check for something wrong with the profiles
      # themselves — wrong type, missing entitlements, expiry, etc.
      - name: Debug — dump downloaded provisioning profiles
        if: always()
        run: |
          echo "--- ~/Library/MobileDevice/Provisioning Profiles/ ---"
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/ 2>&1 || true
          echo "--- ~/Library/Developer/Xcode/UserData/Provisioning Profiles/ ---"
          ls -la ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles/ 2>&1 || true
          for f in ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles/*.mobileprovision; do
            [ -f "$f" ] || continue
            echo "=== $f ==="
            security cms -D -i "$f" | plutil -p -
          done
