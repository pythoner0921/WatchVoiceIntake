name: Release (TestFlight)

# Phase 5 groundwork: build a signed, App Store-distributable build and
# upload it to TestFlight. Manual trigger only — this costs an App Store
# Connect build slot and should happen when there's something worth
# testing, not on every push.
#
# Requires these repo secrets (Settings > Secrets and variables > Actions):
#   APPSTORE_ISSURE_ID       - App Store Connect API key Issuer ID (name has
#                              a typo from when it was first created — kept
#                              as-is rather than making the user redo it)
#   APPSTORE_KEY_ID          - App Store Connect API key Key ID
#   APPSTORE_PRIVATE_KEY     - contents of the downloaded .p8 API key file
#   APPLE_TEAM_ID            - Apple Developer Team ID (Membership page)
#   CERTIFICATE_P12_BASE64   - base64 of the exported Apple Distribution
#                              .p12 (cert + private key)
#   CERTIFICATE_PASSWORD     - password the .p12 was exported with
#
# Build/export/upload go through fastlane, not hand-rolled xcodebuild
# archive/export/altool calls — after many failed attempts pinning down
# undocumented Xcode 16 CLI export behavior (see PROJECT_LOG.md's "release.yml
# 反复失败排查" section), switched to the tool built specifically to absorb
# these per-Xcode-version quirks. Signing is manual, referencing the two App
# Store provisioning profiles created once in the Developer Portal (see
# PROJECT_LOG.md) — not automatic signing, which proved unreliable in CI for
# a brand-new team even after a Distribution certificate existed.
on:
  workflow_dispatch:

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls /Applications | grep -i xcode
          # macos-15 runners default to /Applications/Xcode.app which has
          # been observed to resolve to an outdated Xcode (16.4) that hits
          # an "Unknown Distribution Error" during exportArchive for App
          # Store distribution regardless of exportOptionsPlist content —
          # see PROJECT_LOG.md. Pick the newest Xcode_*.app actually
          # installed on the runner instead of trusting the Xcode.app symlink.
          LATEST_XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "${LATEST_XCODE:-/Applications/Xcode.app}"
          xcodebuild -version

      - name: Install XcodeGen and fastlane
        run: |
          brew install xcodegen
          gem install fastlane -N

      - name: Generate Xcode project
        run: xcodegen generate

      # The Apple Distribution certificate's private key only ever existed
      # in the Mac's local Keychain where it was generated (private keys
      # aren't something Apple's servers hand back) — this runner is a
      # fresh machine every time, so the cert has to be imported into a
      # throwaway keychain here before every build. Standard pattern, see
      # GitHub's own docs: "Installing an Apple certificate on macOS
      # runners for Xcode development."
      - name: Import signing certificate
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD=$(uuidgen)
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          CERT_PATH=$RUNNER_TEMP/certificate.p12

          echo -n "$CERTIFICATE_P12_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed s/\"//g)
          security default-keychain -s "$KEYCHAIN_PATH"

      - name: Build and upload to TestFlight
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSURE_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: fastlane release

      # Same "Unknown Distribution Error" across raw xcodebuild AND
      # fastlane, AND Xcode 16.4 AND 26.3 — ruling out both the tool and
      # the Xcode version. The one thing common to every attempt is the
      # two provisioning profiles we created manually. Dump what
      # -allowProvisioningUpdates actually downloaded (Archive succeeded,
      # so they're on disk) to check for something wrong with the profiles
      # themselves — wrong type, missing entitlements, expiry, etc.
      - name: Debug — dump downloaded provisioning profiles
        if: always()
        run: |
          for f in ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision; do
            echo "=== $f ==="
            security cms -D -i "$f" | plutil -p -
          done
