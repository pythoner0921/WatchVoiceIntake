name: Release (TestFlight)

# Phase 5 groundwork: build a signed, App Store-distributable build and
# upload it to TestFlight. Manual trigger only — this costs an App Store
# Connect build slot and should happen when there's something worth
# testing, not on every push.
#
# Requires these repo secrets (Settings > Secrets and variables > Actions):
#   APPSTORE_ISSURE_ID       - App Store Connect API key Issuer ID (name has
#                              a typo from when it was first created — kept
#                              as-is rather than making the user redo it)
#   APPSTORE_KEY_ID          - App Store Connect API key Key ID
#   APPSTORE_PRIVATE_KEY     - contents of the downloaded .p8 API key file
#   APPLE_TEAM_ID            - Apple Developer Team ID (Membership page)
#
# Uses automatic signing + -allowProvisioningUpdates, so certificates and
# provisioning profiles are created/managed by Xcode via the API key —
# no manually-exported .p12/.mobileprovision files to keep in sync.
on:
  workflow_dispatch:

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Write App Store Connect API key
        env:
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          echo "$APPSTORE_PRIVATE_KEY" > ~/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8

      # The Apple Distribution certificate's private key only ever existed
      # in the Mac's local Keychain where it was generated (private keys
      # aren't something Apple's servers hand back) — this runner is a
      # fresh machine every time, so the cert has to be imported into a
      # throwaway keychain here before every Archive. Standard pattern,
      # see GitHub's own docs: "Installing an Apple certificate on macOS
      # runners for Xcode development."
      - name: Import signing certificate
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD=$(uuidgen)
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          CERT_PATH=$RUNNER_TEMP/certificate.p12

          echo -n "$CERTIFICATE_P12_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed s/\"//g)

          # Belt-and-suspenders: codesign during Archive respects the
          # keychain search list above, but exportArchive's distribution
          # method resolution (IDEDistributionMethodManager) has been
          # reported to only look at the default login keychain — import
          # there too rather than relying on the search list alone.
          security import "$CERT_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k ~/Library/Keychains/login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -k "" ~/Library/Keychains/login.keychain-db 2>/dev/null || true

      - name: Archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive \
            -project WatchVoiceIntake.xcodeproj \
            -scheme WatchVoiceIntake \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/WatchVoiceIntake.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.APPSTORE_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APPSTORE_ISSURE_ID }} \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            DEVELOPMENT_TEAM=$APPLE_TEAM_ID

      - name: Write export options
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > build/ExportOptions.plist << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.shuyinlab.watchvoiceintake</key>
              <string>WatchVoiceIntake AppStore</string>
              <key>com.shuyinlab.watchvoiceintake.watchkitapp</key>
              <string>WatchVoiceIntakeWatch AppStore</string>
            </dict>
          </dict>
          </plist>
          PLIST

      - name: Debug — dump valid exportOptionsPlist method values
        run: |
          xcodebuild -help 2>&1 | grep -B2 -A25 "exportOptionsPlist" || true
          echo "--- archive Info.plist ---"
          plutil -p build/WatchVoiceIntake.xcarchive/Info.plist || true
          echo "--- ExportOptions.plist as written ---"
          plutil -p build/ExportOptions.plist || true

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/WatchVoiceIntake.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.APPSTORE_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APPSTORE_ISSURE_ID }}

      - name: Upload to TestFlight
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSURE_ID }}
        run: |
          xcrun altool --upload-app \
            -f build/export/WatchVoiceIntake.ipa \
            -t ios \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID"
