name: Build (compile only, unsigned)

# Phase 1 acceptance bar: this project COMPILES on a real Xcode toolchain
# we don't own a Mac to run locally. Nothing here signs, installs to a
# device, or uploads anywhere — see the feasibility report's M section for
# what later phases add on top of this.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | grep -i watchos || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned — compile check only)
        # No xcpretty — one less thing that can be missing/outdated on the
        # runner image. Raw xcodebuild output is verbose but its own exit
        # code is all CI actually needs to check.
        run: |
          xcodebuild build \
            -project WatchVoiceIntake.xcodeproj \
            -scheme WatchVoiceIntake \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
